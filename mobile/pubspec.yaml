name: snapit
description: "Reportes ciudadanos sobre la vía pública"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  supercluster: ^3.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # El logo del encabezado: el mismo que usa la web (web/src/assets/logo.png).
  assets:
    - assets/logo.png
    # La foto de perfil de SnapIt en los comentarios: la misma que la web.
    - assets/avatar-snapit.png
