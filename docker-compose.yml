services:
  db:
    image: pgrouting/pgrouting:16-3.5-3.8
    container_name: snapit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta en el .env (ver .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta en el .env (ver .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?falta en el .env (ver .env.example)}
    ports:
      # Solo desde esta PC. El servidor llega a la base por la red interna de Docker.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: snapit-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Adentro de Docker la base se llama "db", no "localhost".
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?falta en el .env (ver .env.example)}
      URL_WEB: ${URL_WEB:?falta en el .env (ver .env.example)}
      # Adentro de Docker los correos van a Mailpit por la red interna.
      SMTP_HOST: mailpit
      SMTP_PUERTO: 1025
      CORREO_REMITENTE: ${CORREO_REMITENTE:?falta en el .env (ver .env.example)}
      FOTOS_DIR: /app/fotos
      FOTO_MAX_MB: ${FOTO_MAX_MB:-10}
    volumes:
      # Las fotos de los reportes sobreviven aunque se reconstruya la imagen.
      - fotos_data:/app/fotos
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Atrapa todos los correos que manda el servidor en desarrollo: no llegan a ninguna casilla real.
  # Se ven en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: snapit-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  db_data:
  fotos_data:

