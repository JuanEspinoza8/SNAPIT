server {
  listen 80;
  root /usr/share/nginx/html;

  # El nombre del servidor se busca en cada petición y no al arrancar: así la web
  # levanta aunque el servidor no esté, y /api responde 502 hasta que aparezca.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

  # La API no habilita CORS: el mismo origen llega al servidor por este proxy.
  location /api/ {
    set $api ${API_UPSTREAM};
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # nginx le pone a cada petición su propio X-Request-Id (reemplaza el que
    # mande el cliente). El servidor lo devuelve y es el que se busca en sus logs.
    proxy_set_header X-Request-Id $request_id;
    # Por defecto nginx corta en 1 MB. Tiene que superar FOTO_MAX_MB del
    # servidor (#13), si no las fotos se rechazan acá con un 413.
    client_max_body_size 20m;
  }

  # SPA: cualquier otra ruta devuelve index.html y React Router resuelve.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
