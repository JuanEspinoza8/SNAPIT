server {
  listen 80;
  root /usr/share/nginx/html;

  # La API no habilita CORS: el mismo origen llega al servidor por este proxy.
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Si el cliente no manda X-Request-Id, lo pone nginx para poder buscar la
    # petición en los logs del servidor (docs/api.md).
    proxy_set_header X-Request-Id $request_id;
  }

  # SPA: cualquier otra ruta devuelve index.html y React Router resuelve.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
